<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="auth-container">
        <h3>Account</h3>
        <p id="auth-status">Sign in or create a student account to manage your registrations.</p>
        <form id="login-form">
          <h4>Sign In</h4>
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required minlength="12" maxlength="256" autocomplete="current-password" />
          </div>
          <button type="submit">Sign In</button>
        </form>
        <form id="register-form">
          <h4>Create Student Account</h4>
          <div class="form-group">
            <label for="register-email">Email:</label>
            <input type="email" id="register-email" required maxlength="254" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="register-password">Password (at least 12 characters):</label>
            <input type="password" id="register-password" required minlength="12" maxlength="256" autocomplete="new-password" />
          </div>
          <button type="submit">Create Account</button>
        </form>
        <button id="logout-button" class="hidden" type="button">Sign Out</button>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <p id="signed-in-as"></p>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </section>

      <div id="message" class="hidden" role="status" aria-live="polite"></div>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
